# CSI-GEP Python environment (prepare.py, cNMF.py). Python 3.12; torch 2.13.0 wheels from PyPI bundle their own CUDA
# runtime (needs a recent NVIDIA driver). Lists only the packages the scripts use; their dependencies are resolved by pip.
# Create: conda env create -f environment_py.yml
name: csigep_py
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
    - anndata==0.10.9
    - fastcluster==1.2.6
    - numpy==1.26.4
    - pandas==2.2.3
    - scanpy==1.10.3
    - scikit-learn==1.5.2
    - scipy==1.14.1
    - torch==2.13.0
    - torchnmf==0.3.5
